<h1>Diktet "Ringen" av Herman Wildenwey</h1>

<p>Min kjæreste ga meg</br>
    en gullring i sitt feste.</br>
    Så ble det forbi</br>
    og det var vel det beste.
</p>

<p>
    Nå ber han om ringen,</br>
    men det vil jeg nekte;</br>
    for vel han var falsk,</br>
    men hans ring - den var ekte!
</p>
