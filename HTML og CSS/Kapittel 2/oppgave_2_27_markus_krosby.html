<!DOCTYPE html>
<html lang="no">
    <head>
        <title>Merker</title>
        <meta charset="UTF-8">
        <style>
            .merkelapper {
                font-family: Tahoma, sans serif;
                display: flex;
                gap: 16px;
                text-transform: uppercase;
            }

            .merkelapper > div {
                border: 1px solid grey;
                padding: 16px 24px;
                border-radius: 25px;
            }
        </style>
    </head>
    <body>
        <div class="merkelapper">
            <div>Dagbladet</div>
            <div>Medier</div>
            <div>Litteratur</div>
            <div>Aksel Kielland</div>
        </div>
    </body>
</html>
