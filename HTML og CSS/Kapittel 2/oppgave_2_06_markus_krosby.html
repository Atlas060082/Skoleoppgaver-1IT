<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave 2.06</title>

    <style>
        h1 {
            color: blue;
            font-size: 50px;
            text-align: center;
        }

        h2 {
            color: green;
            font-size: 30px;
            
        }
        p {
            color: red;
            font-size: 20px;
        }

        .picture-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            outline: 6px solid crimson
        }

        .picture-container img {
            width: 500px;
            height: 500px;
            object-fit: cover;
            gap: 10px;
        }
    </style>
</head>
<body>

<h1> Årstider</h1>

<h2>Vinter</h2>
<p>Vinteren er kald, så er jeg hjemme og spiller.</p>
<h2>Vår</h2>
<p>Våren er fin, så jeg går ute og besøker vennene mine.</p>
<h2>Sommer</h2>
<p>Sommeren er varm, så jeg går meg turer og drar på konserter.</p>
<h2>Høst</h2>
<p>Høsten varierer, så jeg blir både inne og drar til venner i blant.</p>

<div class="picture-container">
<img style="filter: invert(100%);" class="bilde_platekompaniet" src="Bilder/selfie_platekompaniet.jpg" alt="Selfie og peker på plater"></img>
<img style="box-shadow: 2px 2px 8px chartreuse;" class="selfie_greyson" src="Bilder/selfie_m_greyson.jpg" alt="Selfie med kjent trommeslager fra Sepultura, Greyson Nekrutman"></img>
<img style="filter: blur(3px);" class="gruppe_selfie_oslo" src="Bilder/selfie_bygg_oslo.jpg" alt="Selfie med 4 gutter, ved en byggeplass"></img>
<img class="selfie_necrobutcher" src="Bilder/selfie_necrobutcher.jpg" alt="Selfie med Mayhems bassist Necrobutcher"></img>
</div>

</body>
</html>
